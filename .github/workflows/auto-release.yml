name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Infer the next version from Conventional Commits since the last tag
      # (feat -> minor, fix/other -> patch, feat!/BREAKING CHANGE -> major),
      # falling back to a patch bump so every push to main still releases.
      # A commit pushed together with its own version tag (e.g. a manual
      # v1.0.0) is released by release.yml; don't bump it again here.
      - name: Skip if commit is already tagged
        id: tagged
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and create tag
        id: tag
        if: steps.tagged.outputs.already != 'true'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      # github-tag-action creates the tag via the GitHub API, so it is not in
      # the workspace yet. Fetch it so GoReleaser sees the tag on HEAD.
      - name: Sync tags
        if: steps.tag.outputs.new_tag != ''
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      # Run GoReleaser in this job rather than relying on the tag-push event:
      # a tag created with the default GITHUB_TOKEN does not trigger other
      # workflows, so release.yml would not fire for an auto-created tag.
      - name: Run GoReleaser
        if: steps.tag.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
