# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: dbk

before:
  hooks:
    - go mod tidy

builds:
  - id: dbk
    dir: .
    main: ./cmd/dbk
    binary: dbk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/tanzid64/tui-db-manager/internal/buildinfo.Version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
